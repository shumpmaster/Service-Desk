kind = "research"
question = """
From published documentation only: on the Cloudflare Workers Free plan, what limits apply to a single Worker invocation, and how are they measured?

Cover: CPU time per invocation, and whether time spent waiting on outbound network requests counts toward it; the number of outbound (subrequest) fetches one invocation may make; wall-clock duration; and any differences between an invocation started by an HTTP request, a Cron Trigger, and a Durable Object alarm. Say what happens when a limit is exceeded. Also cover the same limits on the Workers Paid plan, for comparison.

Use only public documentation, changelogs and official announcements from Cloudflare, read through web search and web fetch. Do not inspect this session's own environment, configuration, files outside the brief, or any credential. Where the documentation does not say, write "not documented" rather than testing it.

The decision it serves: whether a web application that, on each request, makes about 3 conditional requests to the GitHub REST API for each of 5 repositories (about 15 outbound requests) can run that work in one invocation on the Free plan, or must split it or move to the Paid plan (Service Desk, docs/PROJECT.md §7, O3).

Depth: 3, a graded memo. Topics: hosting, cost, cloudflare.
"""
