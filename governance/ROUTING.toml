stage = "*"
state = "*"
role = "*"
verdict = "*"
round = "*"
action = "card failure"

# Owner gates: who answers, and the valid words by item kind (S-012 AC5).
# "closes" words and "launch approve" refuse a Proxy: line (D-066).

[gates.dor]
answered_by = "owner"
project = ["proceed", "hold", "recycle", "kill", "build", "re-aim", "stop"]

[gates.dor-fail]
answered_by = "chief-of-staff or owner"
project = ["resubmit", "stop"]
owner_only = ["stop"]

[gates.criteria]
answered_by = "owner"
project = ["proceed", "hold", "recycle", "kill", "approve", "revise", "stop"]

[gates.launch]
answered_by = "owner"
project = ["proceed", "hold", "recycle", "kill", "approve", "revise", "stop"]

[gates.stop]
answered_by = "owner"
project_with_spec = ["re-specify", "criteria-wrong", "checks-wrong", "rebuild", "confirm", "re-scope", "drop"]
project_in_shape = ["resubmit", "confirm", "drop"]
research = ["re-specify", "confirm", "drop"]
stage_limits = { rebuild = 5, checks-wrong = 4 }
strikes = { re-specify = true, criteria-wrong = false, checks-wrong = false }

[gates.failure]
answered_by = "owner"
project_with_spec = ["retry", "re-specify", "rebuild", "drop"]
project_in_shape = ["retry", "drop"]
research = ["retry", "re-specify", "drop"]
stage_limits = { rebuild = 5 }
retry_needs_resume = true

[proxy]
refused = ["launch.approve", "launch.proceed", "dor.stop", "dor.kill", "dor-fail.stop", "criteria.stop", "criteria.kill", "launch.stop", "launch.kill", "stop.re-scope", "stop.drop", "failure.drop"]
