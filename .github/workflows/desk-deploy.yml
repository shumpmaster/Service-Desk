# The desk's deploys (spec S-001, Toolchain and deploy route, Workflow 2). Runs only on a push to
# main touching src/** (job preview) and on workflow_dispatch (the job the `job` input names).
# Never on pull_request or workflow_run; no branch name or artifact is used.
#
# Every job runs in a GitHub environment whose required reviewer is the owner, so GitHub holds it
# until the owner approves. The owner approves only a run whose SHA (in the run name) equals the
# merge commit of a pull request the Reviewer passed; production only a SHA the preview already
# deployed and the owner accepted there. A push run deploys exactly github.sha. A dispatch run
# deploys inputs.sha only when it is on main and nothing deployable changed on main since
# (.github/scripts/desk_pick_commit.sh). Each job re-runs the config check on that commit, installs
# nothing under src/, and installs wrangler from .github/deploy-tools (pinned with its lockfile and
# registry) with install scripts off. The Cloudflare token is in the one step that needs it.
# Every action is pinned by commit.
name: desk-deploy
run-name: deploy ${{ github.event_name == 'push' && github.sha || inputs.sha }} — ${{ github.event.head_commit.message || inputs.note }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [preview, production, exp-002]
      sha:
        description: "The full 40-character merge commit to deploy (from the Reviewer-passed PR's page)"
        required: true
        type: string
      note:
        description: "Which PR this is (a hint only; the SHA is what the owner checks)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.job == 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: desk-deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the commit
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desk_pick_commit.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Config check
        run: python3 .github/scripts/desk_config_check.py --require src

      - name: Install the pinned wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/deploy-tools

      - name: Deploy to service-desk-preview
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin/wrangler" pages deploy public \
            --project-name service-desk-preview --branch main

      - name: Summary
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          {
            echo "Deployed \`$SHA\` to the preview."
            echo ""
            echo "https://service-desk-preview.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.job == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: desk-deploy-production
      cancel-in-progress: false
    # A job-level block replaces the workflow-level one, so both are listed.
    permissions:
      contents: read
      actions: read
    env:
      # Set at M3 by a reviewed change, from EXP-002's result: needs-you or the O5 fallback
      # project, and that project's production branch. Empty, the deploy step refuses (AC28).
      PROD_PROJECT: ""
      PROD_BRANCH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the commit
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desk_pick_commit.sh

      - name: The preview deployed this commit last
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: python3 .github/scripts/desk_preview_check.py "$SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Config check
        run: python3 .github/scripts/desk_config_check.py --require src

      - name: Install the pinned wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/deploy-tools

      - name: Deploy to production
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PROD_PROJECT" ] || [ -z "$PROD_BRANCH" ]; then
            echo "::error::The production project and branch are not set yet (M3, from EXP-002)."
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin/wrangler" pages deploy public \
            --project-name "$PROD_PROJECT" --branch "$PROD_BRANCH"

      - name: Summary
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: echo "Deployed \`$SHA\` to $PROD_PROJECT ($PROD_BRANCH)." >> "$GITHUB_STEP_SUMMARY"

  # EXP-002: lists the account's Pages projects, read-only. Deploys nothing.
  exp-002:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.job == 'exp-002'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    concurrency:
      group: desk-deploy-exp-002
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desk_pick_commit.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install the pinned wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/deploy-tools

      - name: List Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin/wrangler" pages project list
