# Context packs (S-010 AC5, D-006). One table per role: what a session of that role receives.
# must_read: always in the pack. may_read: added when the task needs it. must_not_see: never in the
# pack, whatever else matches. include_feedback (S-014 AC5): the records of earlier rounds a role
# needs, added after must_not_see; `decisions/{item}/*.md` never includes `*-notes.md`.
# Patterns are path globs; {spec}, {item}, {project} and {question} stand for the item being worked
# on ({item} is the S-012 item id; a placeholder without a value matches nothing). {ruling} is the
# owner's ruling record a later-work request names (S-024 AC8), from the plan entry; a user-rep entry never carries one (S-025). "library/**" and "ideas/**", "queue/**", "rulings/**" live in the
# portfolio repo (D-068); the Orchestrator (S-008) assembles packs across repos and CI checks each
# session received only its pack.

[roles.input-reader]
must_read = ["research/{question}.md"]
may_read = []
# "The hoped-for answer (D-055)."
must_not_see = ["docs/PROJECT.md", "queue/**", "rulings/**", "decisions/**", "research/*-memo.md"]

[roles.researcher]
# The question, the decision it serves, what each answer would change; plus library entries
# sharing a topic with the question (S-010 AC6).
# S-020 AC9: the groundwork-map form, for a question beginning "Groundwork map:" (S-023 AC10).
must_read = ["research/{question}.md", "library/**", "research/_GROUNDWORK.md"]
may_read = ["intent/PORTFOLIO-INTENT.md"]
# "The hoped-for answer, the Chief of Staff's recommendation, and Kenny's leanings" (D-055).
must_not_see = ["docs/PROJECT.md", "queue/**", "rulings/**", "decisions/**", "ideas/**"]
# Which sources did not say what was claimed; it holds no hoped-for answer (D-055). Its own previous
# memo too, so a later round revises the memo instead of rewriting it blind (LL-015).
include_feedback = ["research/{item}-source-check.md", "research/{item}-memo.md"]

[roles.definer]
must_read = ["docs/PROJECT.md", "library/**", "{ruling}"]
may_read = ["specs/**", "library/patterns/**"]
must_not_see = []
include_feedback = ["reviews/{spec}/plan.md", "decisions/{item}/*.md"]

[roles.critic]
# "The finished document under review; for Triage, the failure and the traceability chain."
must_read = ["specs/{spec}.md", "docs/PROJECT.md", "{ruling}"]
may_read = ["docs/playbooks/**", "library/**", "tests/acceptance/**", "checks/**",  # the checks it reviews (S-016 AC6); holdouts are always excluded
            "governance/standards/definition-of-ready.md",  # the card's "The definition of ready" (D-052), as a file
            "decisions/**",  # the owner's ruling records (model L-0119); the Chief of Staff's -notes.md never enter a pack
            "docs/design/**",  # Design's join-up review (S-024 AC7)
            "docs/users/**", "research/**"]  # the definition of ready's section 9: the profile and the research it cites (S-025 AC5)
# "The writer's drafts and reasoning; the writer's own summary of its work."
must_not_see = ["docs/reports/**", "docs/briefs/**"]

[roles.check-author]
must_read = ["specs/{spec}.md", "{ruling}"]
may_read = ["library/**", "docs/playbooks/**"]
# "Any work product."
must_not_see = ["src/**", "docs/handover/**", "docs/reports/**"]
include_feedback = ["reviews/{spec}/_critic-checks.md"]

[roles.reviewer]
# "The work, the frozen spec, the locked checks."
must_read = ["specs/{spec}.md", "tests/acceptance/**", "checks/**", "src/**", "tests/**", "docs/handover/**", "{ruling}"]
may_read = ["library/**", "docs/playbooks/**"]
# "The builder's summary of its own work."
must_not_see = ["docs/reports/**"]
# The check log is data, not instructions (D-064); it is not the builder's summary of its work.
include_feedback = ["reviews/{spec}/checks.txt"]

[roles.source-checker]
# The memo, the question it answers (the same blind question the Researcher gets), and the
# owner's source standard (a checking rule, not a hoped-for answer).
must_read = ["research/{question}-memo.md", "research/{question}.md", "governance/standards/sources.md"]
may_read = ["library/**", "docs/playbooks/**"]
# The hoped-for answer stays out, as for the Researcher (D-055).
must_not_see = ["docs/PROJECT.md", "queue/**", "rulings/**", "decisions/**"]
# Its own previous report, so a later round checks what changed against what it found (LL-015).
include_feedback = ["research/{item}-source-check.md"]

[roles.builder]
# "The frozen spec, join sheets, the project intent, the locked checks (D-054)."
must_read = ["specs/{spec}.md", "docs/PROJECT.md", "tests/acceptance/**", "checks/**"]
may_read = ["src/**", "tests/**", "docs/**", "library/**", "{ruling}"]
# "The hidden holdout checks" — the sets live outside the repo; their record is kept out too.
must_not_see = ["governance/HOLDOUTS.md", "holdouts/**"]
include_feedback = ["reviews/{spec}/_reviewer-build.md", "reviews/{spec}/reviewer.md", "reviews/{spec}/checks.txt", "decisions/{item}/*.md"]

[roles.critic-triage]
# Triage traces "the failure and the traceability chain" (role card), never the writers' own
# summaries. Dispatch-log month files are copied whole, chosen by name (S-014 AC4).
must_read = ["specs/{spec}.md", "reviews/{spec}/**", "reviews/{item}/**", "triage/{item}*.md", "status/{item}.toml", "dispatch-log/*.jsonl", "{ruling}",
             # A research item has no spec or reviews; its chain is the question and the source check, which
             # quotes each failing claim. Not the memo: it carries the researcher's own summary of its work.
             "intake/requests/{item}.toml", "research/{item}.md", "research/{item}-source-check.md"]
may_read = ["docs/playbooks/**", "library/**", "tests/acceptance/**", "checks/**"]  # S-016 AC6
must_not_see = ["docs/reports/**", "docs/briefs/**"]

[roles.critic-gate]
# S-024 AC7: the gate Critic reads the case and every record it may cite; a Critic's
# independent view, never the Chief of Staff's notes (kept out by name, S-014).
must_read = ["docs/gates/{item}/**", "docs/gates/_GATE.md", "docs/PROJECT.md", "specs/{spec}.md", "reviews/{spec}/**", "reviews/{item}/**", "decisions/{item}/*.md", "status/{item}.toml", "dispatch-log/*.jsonl", "{ruling}"]
# S-023's sprints: a merged item's line and a pull request's reviews/<n>/reviewer.md.
may_read = ["research/**", "docs/design/**", "docs/handover/**", "status/merges.jsonl", "reviews/**", "decisions/questions/**",
            "docs/users/**"]  # the target-user profile a case may cite (S-025 AC5)
# The User representative's records, reviews/<item>/_<phase>-gate-<n>-user.md, are left out of this
# pack by name by the session runner, as the Chief of Staff's notes are, and gate-packs names one in
# a critic-gate manifest (S-025 AC4); a must_not_see pattern would overlap reviews/{item}/**.
must_not_see = ["docs/reports/**", "docs/briefs/**"]

[roles.user-rep]
# S-025 AC4: "only what a user would see": the target-user profile, the item's proposals, the
# form it returns and the screens. No {ruling}: a user would not see the owner's ruling record.
must_read = ["docs/users/PROFILE.md", "docs/gates/{item}/*-proposal.md", "docs/gates/_USER.md"]
may_read = ["docs/design/screens/**"]
# "the Chief of Staff's recommendation or reasoning, the Critic's view and the owner's leanings, never".
must_not_see = ["docs/PROJECT.md", "docs/gates/**/*-case.md", "docs/gates/**/*-case-*.svg", "decisions/**", "specs/**",
                "reviews/**", "research/**", "status/**", "dispatch-log/**", "queue/**", "intake/**", "docs/reports/**",
                "docs/briefs/**", "docs/design/references/**", "docs/handover/**"]
