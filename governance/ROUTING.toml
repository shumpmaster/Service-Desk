action = "dispatch critic-gate"

[[route]]
id = "user-step"
stage = "*"
state = "returned"
role = "critic-gate"
verdict = "none"
round = "*"
condition = "user-step"
action = "dispatch user-rep"

[[route]]
id = "gate-view"
stage = "*"
state = "returned"
role = "critic-gate"
verdict = "none"
round = "*"
condition = "no-user-step"
action = "card next-gate"

[[route]]
id = "user-view"
stage = "*"
state = "returned"
role = "user-rep"
verdict = "none"
round = "*"
action = "card next-gate"

[[route]]
id = "ready-checks"
stage = "*"
state = "ready"
role = "checks"
verdict = "*"
round = "*"
action = "run-checks"

[[route]]
id = "ready-dispatch"
stage = "*"
state = "ready"
role = "*"
verdict = "*"
round = "*"
action = "dispatch item-role"

[[route]]
id = "waiting"
stage = "*"
state = "dispatched"
role = "*"
verdict = "*"
round = "*"
action = "none"

[[route]]
id = "waiting-owner"
stage = "*"
state = "waiting-owner"
