verdict = "*"
round = "*"
action = "run-checks"

[[route]]
id = "checks-run-pass"
stage = 5
state = "returned"
role = "checks"
verdict = "PASS"
round = "*"
action = "dispatch reviewer"

[[route]]
id = "checks-run-fail"
stage = 5
state = "returned"
role = "checks"
verdict = "FAIL"
round = "<3"
action = "dispatch builder"

[[route]]
id = "review-pass"
stage = 5
state = "returned"
role = "reviewer"
verdict = "PASS"
round = "*"
action = "dispatch builder"
then_stage = 6

[[route]]
id = "review-fail"
stage = 5
state = "returned"
role = "reviewer"
verdict = "FAIL"
round = "<3"
action = "dispatch builder"

[[route]]
id = "launch-to-review"
stage = 6
state = "returned"
role = "builder"
verdict = "*"
round = "*"
action = "dispatch reviewer"

[[route]]
id = "launch-pass"
stage = 6
state = "returned"
role = "reviewer"
verdict = "PASS"
round = "*"
action = "gate launch"

[[route]]
id = "launch-fail"
stage = 6
state = "returned"
role = "reviewer"
verdict = "FAIL"
