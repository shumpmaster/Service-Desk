# The Orchestrator's routing table (S-012, frozen). Changing it is a rule change the owner approves
# (R3; Chief of Staff lane). The tests load this file itself (S-012 AC4).
#
# Routes are tried in order; the first match on stage, state, role, verdict and round wins.
# "*" matches anything; a role starting with "!" matches any role but that one. `round` is the
# item's round for its stage's kind: plan_round at stages 2, 3, 4; build_round at 5, 6.
# `condition` "frozen" / "not-frozen" tests the item's current spec's status line;
# "frozen-nothing-needed" also needs the item's latest applied `criteria` decision line to hold
# nothing_needed = "Build" (S-024 AC5); "case-written" / "no-case" test the gate case's path (S-024 AC2),
# and the proposal's too when docs/users/PROFILE.md is in the checkout; "user-step" / "no-user-step"
# test that the profile and the proposal of the item's next_gate and gate_n both exist (S-025 AC2).
# `gate <id>` waits for the Chief of Staff's case at a phase gate; `card next-gate` raises the
# gate's card after the Critic's view, or after the User representative's (S-025); `pass` starts
# no session and moves the item to `then_stage` and `then_role` (S-024 AC2, AC5).
# `then_stage` is the stage the item moves to; `resume` is set on a failure card ("this" = the
# item's current stage and role). Every dispatch first passes the freeze pre-check (stages 4-6),
# then the budget check (exempt: run-checks and critic-triage). See S-012 AC3.

[limits]
budget_per_stage = 12
stall_grace_minutes = 15
usage_limit_hours = 24

[time_limits]   # minutes per role
default = 30

[[route]]
id = "triage-return"
stage = "*"
state = "returned"
role = "critic-triage"
verdict = "*"
round = "*"
action = "card stop"

[[route]]
id = "third-fail"
stage = "*"
state = "returned"
role = "!critic-triage"
verdict = "FAIL"
round = ">=3"
action = "dispatch critic-triage"

[[route]]
id = "malformed-return"
stage = "*"
state = "returned"
role = "*"
verdict = "malformed"
round = "*"
action = "card failure"
resume = "this"

[[route]]
id = "dor-pass"
stage = 2
state = "returned"
role = "critic"
verdict = "PASS"
round = "*"
action = "gate dor"

[[route]]
id = "dor-fail"
stage = 2
state = "returned"
role = "critic"
verdict = "FAIL"
round = "<3"
action = "card dor-fail"

[[route]]
id = "research-to-source"
stage = 2
state = "returned"
role = "researcher"
verdict = "*"
round = "*"
action = "dispatch source-checker"

[[route]]
id = "source-pass"
stage = 2
state = "returned"
role = "source-checker"
verdict = "PASS"
round = "*"
action = "done"

[[route]]
id = "source-fail"
stage = 2
state = "returned"
role = "source-checker"
verdict = "FAIL"
round = "<3"
action = "dispatch researcher"

[[route]]
id = "define-to-plan-review"
stage = 3
state = "returned"
role = "definer"
verdict = "*"
round = "*"
action = "dispatch critic"

[[route]]
id = "plan-pass"
stage = 3
state = "returned"
role = "critic"
verdict = "PASS"
round = "*"
action = "gate criteria"

[[route]]
id = "plan-fail"
stage = 3
state = "returned"
role = "critic"
verdict = "FAIL"
round = "<3"
action = "dispatch definer"

[[route]]
id = "freeze-nothing-needed"
stage = 3
state = "returned"
role = "definer-freeze"
verdict = "*"
round = "*"
condition = "frozen-nothing-needed"
action = "pass"
then_stage = 6
then_role = "builder"

[[route]]
id = "freeze-frozen"
stage = 3
state = "returned"
role = "definer-freeze"
verdict = "*"
round = "*"
condition = "frozen"
action = "dispatch check-author"
then_stage = 4

[[route]]
id = "freeze-not-frozen"
stage = 3
state = "returned"
role = "definer-freeze"
verdict = "*"
round = "*"
condition = "not-frozen"
action = "card failure"
resume = "3/definer-freeze"

[[route]]
id = "fix-frozen"
stage = 4
state = "returned"
role = "definer-freeze"
verdict = "*"
round = "*"
condition = "frozen"
action = "dispatch check-author"
then_stage = 4

[[route]]
id = "fix-not-frozen"
stage = 4
state = "returned"
role = "definer-freeze"
verdict = "*"
round = "*"
condition = "not-frozen"
action = "card failure"
resume = "4/definer-freeze"

[[route]]
id = "checks-to-critic"
stage = 4
state = "returned"
role = "check-author"
verdict = "*"
round = "*"
action = "dispatch critic"

[[route]]
id = "checks-pass"
stage = 4
state = "returned"
role = "critic"
verdict = "PASS"
round = "*"
action = "dispatch builder"
