[[route]]
id = "case-wait"
stage = "*"
state = "ready"
role = "critic-gate"
verdict = "*"
round = "*"
condition = "no-case"
action = "none"

[[route]]
id = "case-ready"
stage = "*"
state = "ready"
role = "critic-gate"
verdict = "*"
round = "*"
