kind = "research"
question = """
From published design guidance only: how should a phone-first status dashboard, used by one person to oversee several automated software projects, be designed so a few-second glance tells the owner where to drill in, with dashboard-level detail one step down rather than on the first screen?

Cover:
- progressive disclosure for glanceable overviews: what belongs on the first screen of a phone dashboard, what one tap down, and how a summary signals that detail is worth opening;
- showing the stage of work that can loop back, stall or wait, per item and per project, without implying a percentage complete or steady progress;
- a one-line "where it's heading" summary per project (the current phase, the upcoming work, what it unlocks) built from records without overclaiming;
- telling different kinds of item apart without ranking their urgency (e.g. irreversible or self-defaulting decisions versus routine merges);
- change on a screen that updates itself every minute: reordering, highlighting what is new since the last visit, avoiding layout shift and mis-taps;
- an activity view of who is working on what, why, and what changed;
- timelines on a 360 px screen holding events of very different lengths (minutes to days), past events beside planned ones with no fixed time;
- showing values that are unknown, stale or estimated (in gauges, numbers and summary lines) so they are never read as real or as zero, and making stale data visibly degrade;
- a short standards lookup only: colour not used alone, contrast minimums for text and graphics, touch-target minimums, reduced motion.

Use only public sources read through web search and web fetch: platform guidelines (Apple Human Interface Guidelines, Material Design), accessibility standards (WCAG 2.2 and its understanding documents), published usability research (e.g. Nielsen Norman Group, Baymard, academic HCI papers) and information-design and data-visualisation literature. Do not inspect this session's own environment, configuration, files outside the brief, or any credential.

How sources are graded for this question (design guidance, not product behaviour), replacing Q-010's "two independent sources" rule, which design guidance could not meet:
- A platform's own guideline (Apple, Google) or a W3C standard is authoritative for what it prescribes. Report it as "guideline (single authoritative source)", quoted, with its page. A second page from the same publisher adds nothing and is not needed.
- A design principle is "corroborated" when two sources with different authors state it. A restatement that cites or derives from another listed source (e.g. a course page summarising Munzner, or Munzner building on Mackinlay) is labelled "derivative of <source>" and does not count as a second source.
- A finding stated by one source only is kept, labelled "single source", never dropped and never called confirmed.
- Where guidelines disagree (e.g. different minimum touch-target sizes), report each with its source, without choosing.
- Every claim must be supported by the exact page cited; quote the sentence. Where the guidance does not say, write "not documented". Make no recommendation of a specific product or library.

The decision it serves: the Service Desk's design milestone (between S-001's M2 and M3), where the owner chooses a visual design through mockups and a sandbox view (decisions/questions/P-001-design-step.md; the owner's answers in P-001-design-discovery.md). It replaces Q-010, dropped by the owner (decisions/Q-010/stop-1.md) after triage found Q-010's independence rule could not be met by design guidance.

Depth: 3, a graded memo. Topics: design, dashboards, information-design, accessibility, mobile.
"""
