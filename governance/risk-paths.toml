# Path → risk class and required reviews (OPERATING_MODEL §3). CODEOWNERS-protected at T2+.
# A path takes the highest class any rule gives it; a change takes the highest class of its
# paths. Agents never choose it. Read by governance/checks/review_check.py (Python 3.11+).

unmatched = "R1"          # class for a path no rule matches

[classes]
R3 = [                    # irreversible or gate-bearing: owner approval (A4)
  "AGENTS.md",
  "governance/**",
  ".claude/**",
  ".github/**",
  "tests/acceptance/**",
  "**/migrations/**",
  "infra/**",
  "requirements*.txt",
  "pyproject.toml",
  "package.json",
  "package-lock.json",
  "src/notify/**",          # the notification sender: runs unattended with the notification secrets (S-001, CS18)
  "src/config/projects.json",  # names the push key, the tap's address and the usage account (S-001, CS18)
  "src/lib/jobcand.js",        # the job-candidate judgment the sender runs with the notification secrets (S-001, CS23)
  "src/lib/ledgergrant.js",    # the ledger grant reading the sender runs with the notification secrets (S-001, CS23)
  "src/lib/j22.js",            # the "with the agents" rule (J22 rule 0) the sender runs with the notification secrets (S-001, CS24)
]
R2 = ["src/ui/**", "config/**"]            # user-facing behavior, config, compatible schema
R1 = ["src/**", "tests/**"]                # ordinary source with tests
R0 = ["docs/**", "digest/**", "specs/**", "experiments/**", "questions/**", "reviews/**", "triage/**",
      "research/**", "library/**", "intake/**", "status/**", "dispatch-log/**", "queue/**", "decisions/**", "sessions/**",
      "README.md", "CLAUDE.md"]

[reviews]                 # verdicts a change needs, by its class: reviews/<PR>/<reviewer-id>.md
R0 = []
R1 = ["reviewer"]
R2 = ["reviewer"]         # + a cross-vendor reviewer if §11 experiment 1 shows it pays
R3 = ["reviewer", "owner"]

# Domains add to (never replace) the defaults. See governance/domains/security/.

# Domain reviewers (e.g. a security reviewer for auth and payments paths) are added per project,
# with their roster row, agent file and a [paths."<glob>"] table here (v3 template, S-010).

# Design (governance/domains/design/README.md): the page the owner sees. src/public/ is everything the
# site serves. The page's modules are written in src/lib/ but served from byte-identical copies in
# src/public/lib/, and the home-screen icons drawn by src/tools/icons.mjs are served from
# src/public/icons/; src/tools/build.mjs fails a change whose copies are stale, so this one glob
# also catches those changes. No `risk`: the domain adds a verdict, not a higher class.
[paths."src/public/**"]
reviews = ["design-reviewer"]
